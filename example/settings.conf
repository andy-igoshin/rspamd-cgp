################################################################################
# Пример settings.conf для Rspamd.
#
# Устанавливает символ AUTHENTICATED_USER для аутентифицированных сообщений.
#
authenticated {
  priority = high;
  authenticated = yes;
  apply {
    AUTHENTICATED_USER = 0.0;
  }
  symbols [
    "AUTHENTICATED_USER"
  ]
}
